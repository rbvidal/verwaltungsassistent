spring:
  datasource:
    url: jdbc:h2:mem:verwaltungsassistent;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

platform:
  auth:
    jwt-secret: dev-jwt-secret-that-is-at-least-32-bytes-long!!
    issuer: verwaltungsassistent-dev

logging:
  level:
    verwaltungsassistent.web: DEBUG
