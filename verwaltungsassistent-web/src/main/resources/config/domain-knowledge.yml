# ============================================================
# Verwaltungsassistent Domain Knowledge Configuration
# ============================================================
# Externalized domain terminology, weights, and classification
# parameters. DomainClassifier consumes this via DomainKnowledge.
#
# To add a new domain term: add an entry under the appropriate
# domain with a phrase and weight. No Java code change needed.
# ============================================================

platform:
  ai:
    domain:
      # ── Algorithm configuration ──
      compound-embedding-penalty: 0.85
      minimum-primary-confidence: 0.15
      minimum-secondary-confidence: 0.20

      # ── Short generic terms that must match at word boundaries ──
      # Prevents false positives from compound words like
      # "Bauingenieur" triggering BUILDING.
      word-boundary-terms:
        - bau
        - reise
        - hotel
        - bahn
        - flug
        - lohn

