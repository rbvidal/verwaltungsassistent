<!DOCTYPE html>
<html th:replace="~{layout/default :: layout(~{::content}, '404 — Seite nicht gefunden', 'none', null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <div class="error-page">
            <h1>Seite nicht gefunden</h1>
            <p>Die angeforderte Seite existiert nicht.</p>
            <a th:href="@{/dashboard}" class="btn btn--primary">Zurück zum Dashboard</a>
        </div>
    </th:block>
</body>
</html>
